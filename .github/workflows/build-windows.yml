
name: Build PHOTO_MANAGER V1.4

on:
  workflow_dispatch:
  push:
    paths:
      - 'PHOTO_MANAGER_SOURCE.zip'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Extract source
        shell: pwsh
        run: |
          Expand-Archive PHOTO_MANAGER_SOURCE.zip -DestinationPath source -Force

      - name: Install dependencies
        working-directory: source/PHOTO_MANAGER_V1.4
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Test sync engine
        working-directory: source/PHOTO_MANAGER_V1.4
        run: python test_sync.py

      - name: Build Windows EXE
        working-directory: source/PHOTO_MANAGER_V1.4
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name PHOTO_MANAGER --icon PHOTO_MANAGER.ico --add-data "PHOTO_MANAGER.ico;." --collect-all pillow_heif qt_app.py

      - name: Prepare portable package
        working-directory: source/PHOTO_MANAGER_V1.4
        shell: pwsh
        run: |
          $out = "dist/PHOTO_MANAGER"

          Copy-Item exiftool.exe $out
          Copy-Item exiftool_files $out -Recurse

          Copy-Item README.txt $out
          Copy-Item DEVELOPMENT_LOG.txt $out
          Copy-Item CHANGELOG.txt $out
          Copy-Item SPECIFICATION.txt $out
          Copy-Item TEST_RESULTS.txt $out

          New-Item -ItemType Directory -Path "$out/SOURCE" -Force

          Copy-Item qt_app.py "$out/SOURCE"
          Copy-Item photo_manager_v1_4.py "$out/SOURCE"
          Copy-Item legacy.py "$out/SOURCE"
          Copy-Item requirements.txt "$out/SOURCE"
          Copy-Item PHOTO_MANAGER.ico "$out/SOURCE"

          if (!(Test-Path "$out/PHOTO_MANAGER.exe")) {
            throw "EXE build failed"
          }

          Compress-Archive -Path "$out/*" -DestinationPath "../../PHOTO_MANAGER_V1.4.zip" -Force

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PHOTO_MANAGER_V1.4
          path: PHOTO_MANAGER_V1.4.zip
          retention-days: 30
          if-no-files-found: error
