
name: Build PHOTO_MANAGER V2.0

on:
  workflow_dispatch:
  push:
    paths:
      - PHOTO_MANAGER_V2.0.zip
      - .github/workflows/build-windows.yml

jobs:
  build-windows:
    runs-on: windows-latest

    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract source
        run: |
          $zip = 'PHOTO_MANAGER_V2.0.zip'
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()

          Write-Host "Source SHA256: $actual"

          if ($actual -ne '56b08aa926b0d7a1e85d50fb1fe4a4e6fd041eb0197d5b57873d38d30558a62f') {
            throw 'Wrong source ZIP SHA256'
          }

          Write-Host "Git commit: $env:GITHUB_SHA"

          Expand-Archive $zip -DestinationPath source -Force

          $root = 'source/PHOTO_MANAGER_V2.0'

          Get-Content "$root/BUILD_ID.txt"

          $script = Get-Content "$root/prepare_clip.py" -Raw

          if ($script -notmatch 'use_safetensors=False' -or $script -match 'use_safetensors=True') {
            throw 'Wrong CLIP source'
          }

          Select-String -Path "$root/prepare_clip.py" -Pattern 'use_safetensors'

      - name: Install dependencies
        working-directory: source/PHOTO_MANAGER_V2.0
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare CLIP model
        working-directory: source/PHOTO_MANAGER_V2.0
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python -m pip install -r requirements-clip-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $model = Invoke-RestMethod 'https://huggingface.co/api/models/openai/clip-vit-base-patch32'
          $license = $model.cardData.license

          Write-Host "Hugging Face model license: $license"

          if ($license -and $license -ne "mit") {
            throw "Unexpected model license: $license"
          }

          if (-not $license) {
            Write-Warning "Model license metadata missing; distribution review pending."
          }

          $revision = '3d74acf9a28c67741b2f4f2ea7635f0aaf6f0268'

          if ($revision -notmatch '^[0-9a-f]{40}$') {
            throw 'Invalid model revision'
          }

          Write-Host "CLIP model revision: $revision"

          python prepare_clip.py --revision $revision
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Invoke-WebRequest 'https://raw.githubusercontent.com/openai/CLIP/main/LICENSE' -OutFile AI_MODELS/CLIP_LICENSE.txt

          Invoke-WebRequest "https://huggingface.co/openai/clip-vit-base-patch32/raw/$revision/README.md" -OutFile AI_MODELS/MODEL_CARD.md

      - name: Test engines
        working-directory: source/PHOTO_MANAGER_V2.0
        run: |
          python -m compileall -q . -x "exiftool_files"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $tests = @(
            'test_sync.py',
            'test_library.py',
            'test_everything.py',
            'test_organize.py',
            'test_sync_v16.py',
            'test_dedup_v16.py',
            'test_clip_local.py',
            'test_metadata.py',
            'test_pair_sync.py',
            'test_date_repair.py',
            'test_closeout.py'
          )

          foreach ($test in $tests) {
            Write-Host "Running $test"
            python $test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          python -c "from clip_local import ClipLocal; from PIL import Image; Image.new('RGB',(224,224),'blue').save('clip_smoke.png'); print(ClipLocal().classify('clip_smoke.png'))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Write-Host "All engine tests completed."

      - name: Build Windows EXE
        working-directory: source/PHOTO_MANAGER_V2.0
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --noupx --name PHOTO_MANAGER --icon PHOTO_MANAGER.ico --add-data 'PHOTO_MANAGER.ico;.' --version-file version_info.txt --collect-all pillow_heif --collect-all onnxruntime qt_app.py

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare portable package
        working-directory: source/PHOTO_MANAGER_V2.0
        run: |
          Rename-Item dist/PHOTO_MANAGER PHOTO_MANAGER_V2.0

          $out = 'dist/PHOTO_MANAGER_V2.0'

          Copy-Item exiftool.exe, README.txt $out -Force
          Copy-Item exiftool_files, AI_MODELS $out -Recurse -Force

          New-Item -ItemType Directory "$out/DOCUMENTS", "$out/SOURCE" -Force

          Copy-Item CHANGELOG.txt, DEVELOPMENT_LOG.txt, SPECIFICATION.txt, TEST_RESULTS.txt, USER_MANUAL.txt, RELEASE_TEST_LOG.txt, RELEASE_STATUS.txt "$out/DOCUMENTS" -Force

          Copy-Item qt_app.py, library_setup.py, photo_manager_v1_4.py, legacy.py, requirements.txt, test_sync.py, test_library.py, everything_search.py, test_everything.py, organize.py, test_organize.py, test_metadata.py, screenshot_detect.py, version.py, version_info.txt, PHOTO_MANAGER.ico "$out/SOURCE" -Force

          Copy-Item clip_local.py, prepare_clip.py, evaluate_clip.py, test_clip_local.py, test_sync_v16.py, test_dedup_v16.py, requirements-clip-build.txt, test_pair_sync.py, test_date_repair.py, test_closeout.py, BUILD_ID.txt "$out/SOURCE" -Force

          $required = @(
            'PHOTO_MANAGER.exe',
            '_internal',
            'exiftool.exe',
            'exiftool_files',
            'AI_MODELS/image_encoder.onnx',
            'AI_MODELS/manifest.json',
            'AI_MODELS/text_embeddings.npy',
            'AI_MODELS/CLIP_LICENSE.txt',
            'AI_MODELS/MODEL_CARD.md',
            'DOCUMENTS/RELEASE_STATUS.txt',
            'SOURCE/BUILD_ID.txt'
          )

          foreach ($item in $required) {
            if (!(Test-Path "$out/$item")) {
              throw "Missing: $item"
            }
          }

          Write-Host "PHOTO_MANAGER V2.0 package ready."

      - name: Upload PHOTO_MANAGER V2.0
        uses: actions/upload-artifact@v4
        with:
          name: PHOTO_MANAGER_V2.0
          path: source/PHOTO_MANAGER_V2.0/dist/PHOTO_MANAGER_V2.0/
          if-no-files-found: error
          retention-days: 30
