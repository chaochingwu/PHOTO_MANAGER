
name: Build PHOTO_MANAGER V1.5a

on:
  workflow_dispatch:
  push:
    paths:
      - PHOTO_MANAGER_V1.5a_SOURCE.zip
      - .github/workflows/build-windows.yml

jobs:
  build-windows:
    runs-on: windows-latest

    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract source
        run: |
          Expand-Archive PHOTO_MANAGER_V1.5a_SOURCE.zip -DestinationPath source -Force

      - name: Install dependencies
        working-directory: source/PHOTO_MANAGER_V1.5a
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test engines
        working-directory: source/PHOTO_MANAGER_V1.5a
        run: |
          python -m compileall -q . -x "exiftool_files"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python test_sync.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python test_library.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python test_everything.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python test_organize.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python test_metadata.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows EXE
        working-directory: source/PHOTO_MANAGER_V1.5a
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --noupx --name PHOTO_MANAGER --icon PHOTO_MANAGER.ico --add-data 'PHOTO_MANAGER.ico;.' --version-file version_info.txt --collect-all pillow_heif qt_app.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare portable directory
        working-directory: source/PHOTO_MANAGER_V1.5a
        run: |
          $out = 'dist/PHOTO_MANAGER'

          Copy-Item exiftool.exe, README.txt $out -Force
          Copy-Item exiftool_files $out -Recurse -Force

          New-Item -ItemType Directory "$out/DOCUMENTS", "$out/SOURCE" -Force

          Copy-Item CHANGELOG.txt, DEVELOPMENT_LOG.txt, SPECIFICATION.txt, TEST_RESULTS.txt "$out/DOCUMENTS" -Force

          Copy-Item qt_app.py, library_setup.py, photo_manager_v1_4.py, legacy.py, requirements.txt, test_sync.py, test_library.py, everything_search.py, test_everything.py, organize.py, test_organize.py, test_metadata.py, screenshot_detect.py, version.py, version_info.txt, PHOTO_MANAGER.ico "$out/SOURCE" -Force

          if (!(Test-Path "$out/PHOTO_MANAGER.exe")) {
            throw 'PHOTO_MANAGER.exe missing'
          }

          if (!(Test-Path "$out/exiftool.exe")) {
            throw 'exiftool.exe missing'
          }

          if (!(Test-Path "$out/exiftool_files")) {
            throw 'exiftool_files missing'
          }

          if (!(Test-Path "$out/_internal")) {
            throw 'PyInstaller internal directory missing'
          }

      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: PHOTO_MANAGER_V1.5a
          path: source/PHOTO_MANAGER_V1.5a/dist/PHOTO_MANAGER/
          if-no-files-found: error
          retention-days: 30
