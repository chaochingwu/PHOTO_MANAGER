
name: Build PHOTO_MANAGER V1.5

on:
  workflow_dispatch:
  push:
    paths:
      - PHOTO_MANAGER_V1.5_REBUILD_SOURCE.zip
      - .github/workflows/build-windows.yml

jobs:
  build-windows:
    runs-on: windows-latest

    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract source
        run: Expand-Archive PHOTO_MANAGER_V1.5_REBUILD_SOURCE.zip -DestinationPath source

      - name: Install dependencies
        working-directory: source/PHOTO_MANAGER_V1.5
        run: python -m pip install -r requirements.txt

      - name: Test engines
        working-directory: source/PHOTO_MANAGER_V1.5
        run: |
          python -m py_compile qt_app.py library_setup.py photo_manager_v1_4.py legacy.py everything_search.py organize.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python test_sync.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python test_library.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python test_everything.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python test_organize.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows EXE
        working-directory: source/PHOTO_MANAGER_V1.5
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --noupx --name PHOTO_MANAGER --icon PHOTO_MANAGER.ico --add-data 'PHOTO_MANAGER.ico;.' --collect-all pillow_heif qt_app.py

      - name: Prepare portable directory
        working-directory: source/PHOTO_MANAGER_V1.5
        run: |
          $out = 'dist/PHOTO_MANAGER'

          Copy-Item exiftool.exe, README.txt $out
          Copy-Item exiftool_files $out -Recurse

          New-Item -ItemType Directory "$out/DOCUMENTS", "$out/SOURCE" -Force

          Copy-Item CHANGELOG.txt, DEVELOPMENT_LOG.txt, SPECIFICATION.txt, TEST_RESULTS.txt "$out/DOCUMENTS"

          Copy-Item qt_app.py, library_setup.py, photo_manager_v1_4.py, legacy.py, requirements.txt, test_sync.py, test_library.py, everything_search.py, test_everything.py, organize.py, test_organize.py, PHOTO_MANAGER.ico "$out/SOURCE"

          if (!(Test-Path "$out/PHOTO_MANAGER.exe")) {
            throw 'EXE missing'
          }

      - uses: actions/upload-artifact@v4
        with:
          name: PHOTO_MANAGER_V1.5
          path: source/PHOTO_MANAGER_V1.5/dist/PHOTO_MANAGER/
          if-no-files-found: error
